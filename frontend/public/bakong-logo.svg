<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Red background circle -->
  <circle cx="50" cy="50" r="48" fill="#CE181E" stroke="#FFFFFF" stroke-width="4"/>
  
  <!-- Outer concentric ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  
  <!-- Central rosette / 8-pointed floral motif -->
  <circle cx="50" cy="50" r="14" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="5" fill="#FFFFFF"/>
  
  <!-- 8 Petal dots / rays -->
  <g fill="#FFFFFF">
    <circle cx="50" cy="26" r="3.2"/>
    <circle cx="50" cy="74" r="3.2"/>
    <circle cx="26" cy="50" r="3.2"/>
    <circle cx="74" cy="50" r="3.2"/>
    <circle cx="33" cy="33" r="2.8"/>
    <circle cx="67" cy="33" r="2.8"/>
    <circle cx="33" cy="67" r="2.8"/>
    <circle cx="67" cy="67" r="2.8"/>
  </g>
  
  <!-- Geometric lotus connection ribs -->
  <path d="M50 18 L50 23 M50 77 L50 82 M18 50 L23 50 M77 50 L82 50" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
